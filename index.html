<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Join our learning platform today</p>
    
    <div class="success-overlay" id="successScreen">
        <div class="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#00e676" stroke-width="3" width="40" height="40">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h2 class="success-title">Registration Successful!</h2>
        <p class="subtitle" style="margin-top: 10px; margin-bottom: 25px;">Your registration details have been securely recorded.</p>
        <button class="submit-btn" style="width: auto; padding: 10px 30px;" onclick="resetFormView()">Register New Student</button>
    </div>

    <form id="interactiveForm" novalidate>
        
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Jane Doe">
            <div class="error-message" id="nameError"></div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="jane.doe@example.com">
            <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="10-digit number">
                <div class="error-message" id="mobileError"></div>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
                <div class="error-message" id="dobError"></div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 8 characters">
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat password">
                <div class="error-message" id="cPasswordError"></div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Gender</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
                <div class="error-message" id="genderError"></div>
            </div>
            <div class="form-group">
                <label for="course">Course</label>
                <select id="course">
                    <option value="">-- Choose Course --</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Data Analytics">Data Analytics</option>
                    <option value="Cyber Security">Cyber Security</option>
                </select>
                <div class="error-message" id="courseError"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" placeholder="Enter physical home or campus address"></textarea>
            <div class="error-message" id="addressError"></div>
        </div>

        <button type="submit" class="submit-btn">Complete Registration</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
